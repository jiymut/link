<style>
  :root{
    --bg: #0c0a13;
    --bg-card: #16121f;
    --thread: #726f89;
    --thread-soft: #423d54;
    --accent: #b48cff;
    --accent-soft: #7c5cff;
    --text: #f3f1f8;
    --muted: #9992ad;
    --wa: #4fd68a;
    --ig: #ff8fb1;
    --tt: #7fe0e8;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  .bg-web{
    position:fixed;
    inset:0;
    width:100%; height:100%;
    z-index:0;
    opacity:0.35;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:460px;
    margin:0 auto;
    padding: 56px 22px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .corner-thread{
    position:absolute;
    top:0; right:24px;
    width:2px;
    height:120px;
    background: linear-gradient(to bottom, var(--thread), transparent);
  }

  .spider{
    position:absolute;
    top:98px; right:14px;
    font-size:22px;
    transform-origin: top center;
    animation: dangle 4s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(180,140,255,0.25));
  }
  @keyframes dangle{
    0%,100%{ transform: rotate(-6deg); }
    50%{ transform: rotate(6deg); }
  }

  .avatar-frame{
    position:relative;
    width:112px; height:112px;
    margin-bottom:22px;
  }
  .avatar-web{
    position:absolute;
    inset:-34px;
    width:180px; height:180px;
  }
  .avatar{
    width:112px; height:112px;
    border-radius:50%;
    background: radial-gradient(circle at 32% 28%, #2a2440, #100d1a 72%);
    border:1.5px solid var(--thread-soft);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-size:38px; font-weight:700;
    color: var(--accent);
    box-shadow: 0 0 0 6px rgba(124,92,255,0.06), 0 20px 40px -14px rgba(124,92,255,0.35);
  }

  .handle{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.06em;
    color: var(--accent);
    background: rgba(124,92,255,0.1);
    border:1px solid rgba(124,92,255,0.25);
    padding:4px 12px;
    border-radius:100px;
    margin-bottom:14px;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-0.01em;
    text-align:center;
  }

  .tagline{
    color: var(--muted);
    font-size:14.5px;
    text-align:center;
    max-width:300px;
    line-height:1.55;
    margin: 0 0 38px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
    position:relative;
  }

  .links::before{
    content:"";
    position:absolute;
    left:50%;
    top:-18px;
    width:1px;
    height:18px;
    background: linear-gradient(to bottom, transparent, var(--thread));
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:15px 18px;
    background: var(--bg-card);
    border:1px solid var(--thread-soft);
    border-radius:14px;
    text-decoration:none;
    color: var(--text);
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .link-card::before{
    content:"";
    position:absolute;
    left:24px; right:24px; top:-14px;
    height:14px;
    border-left:1px solid var(--thread-soft);
    border-right:1px solid var(--thread-soft);
    border-bottom:none;
    opacity:.5;
    pointer-events:none;
  }
  .link-card:first-child::before{ display:none; }

  .link-card:hover{
    transform: translateY(-2px);
    border-color: var(--accent-soft);
    background:#1b1628;
  }

  .icon{
    flex:0 0 auto;
    width:38px; height:38px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    background: rgba(255,255,255,0.04);
  }
  .icon svg{ width:19px; height:19px; }

  .link-text{ flex:1; min-width:0; }
  .link-title{ font-weight:600; font-size:15px; }
  .link-sub{ font-size:12px; color: var(--muted); margin-top:1px; }

  .arrow{ color: var(--thread); font-size:15px; flex:0 0 auto; }

  .tt .icon{ color:var(--tt); }
  .wa .icon{ color:var(--wa); }
  .ig .icon{ color:var(--ig); }
  .yt .icon{ color:#ff7a7a; }
  .x  .icon{ color:#d9d6e6; }
  .em .icon{ color:#ffd27f; }

  footer{
    margin-top:44px;
    text-align:center;
  }
  footer .thread-end{
    width:1px; height:22px;
    background: linear-gradient(to bottom, var(--thread), transparent);
    margin: 0 auto 10px;
  }
  footer p{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--thread);
    letter-spacing:0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .spider{ animation:none; }
  }
</style>
